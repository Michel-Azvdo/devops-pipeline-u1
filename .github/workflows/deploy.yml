name: Deploy

on:
  workflow_run:
    workflows: ["Infra Check"]
    types: [completed]

jobs:
  deploy:
    # só continua se o Infra Check terminou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Confirmar que os testes passaram neste commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          RESULT=""
          for i in $(seq 1 12); do
            RESULT=$(gh run list --workflow "Testes" --commit "$SHA" --json conclusion --jq '.[0].conclusion')
            [ -n "$RESULT" ] && break
            sleep 10
          done
          echo "Resultado dos testes: $RESULT"
          [ "$RESULT" = "success" ] || exit 1

      - name: Executar deploy simulado
        run: bash deploy/deploy.sh

      - name: Registrar sucesso
        run: |
          echo "Deploy concluído com sucesso!"
          echo "Commit implantado: ${{ github.event.workflow_run.head_sha }}"
